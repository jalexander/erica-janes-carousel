<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <title>Erica Jane's Carousel</title>
  </head>
  <body>
    <div class="stage">
      <div class="carousel"></div>
    </div>

    <div class="carousel-controls">
      <button type="button" class="carousel-controls__toggle" aria-label="Pause">
        <svg
          class="carousel-controls__icon"
          viewBox="0 0 40 40"
          aria-hidden="true"
          focusable="false"
        >
          <defs>
            <mask id="carousel-mask-pause">
              <circle cx="20" cy="20" r="19.5" fill="#fff" />
              <rect x="14" y="12" width="4" height="16" rx="1.5" fill="#000" />
              <rect x="22" y="12" width="4" height="16" rx="1.5" fill="#000" />
            </mask>
            <mask id="carousel-mask-play">
              <circle cx="20" cy="20" r="19.5" fill="#fff" />
              <path d="M16 12.5 28.5 20 16 27.5 Z" fill="#000" />
            </mask>
          </defs>
          <circle
            class="carousel-controls__disc carousel-controls__pause"
            cx="20"
            cy="20"
            r="19.5"
            mask="url(#carousel-mask-pause)"
          />
          <circle
            class="carousel-controls__disc carousel-controls__play"
            cx="20"
            cy="20"
            r="19.5"
            mask="url(#carousel-mask-play)"
          />
        </svg>
      </button>
    </div>

    <div class="svg-attribution">
      icons made by
      <a href="https://www.freepik.com" title="Freepik" target="_blank" rel="noopener noreferrer"
        >freepik</a
      >
      from
      <a href="https://www.flaticon.com/" title="Flaticon" target="_blank" rel="noopener noreferrer"
        >www.flaticon.com</a
      >
      is licensed by
      <a
        href="https://creativecommons.org/licenses/by/3.0/"
        title="Creative Commons BY 3.0"
        target="_blank"
        rel="noopener noreferrer"
        >CC 3.0 BY</a
      >
    </div>

    <script type="module" src="/src/index.js"></script>
  </body>
</html>
